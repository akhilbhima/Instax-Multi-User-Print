<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Instax Party Printer</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #1c1a24; color: #fff;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; text-align: center;
  }
  h1 { font-size: 1.6rem; margin-bottom: 6px; }
  p.sub { color: #b9b4c7; margin-bottom: 16px; }
  #film-status { color: #d9d4e7; font-size: 0.9rem; margin-bottom: 24px;
    min-height: 1.2em; }
  #film-status .oof { color: #ff5d8f; font-weight: 600; }
  .step { width: 100%; max-width: 420px; }
  .big-btn {
    display: block; width: 100%; padding: 22px; margin: 10px 0;
    font-size: 1.25rem; font-weight: 700; border: none; border-radius: 16px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #pick-btn { background: #ffb703; color: #1c1a24; }
  .fmt-mini { background: #ff5d8f; color: #fff; }
  .fmt-wide { background: #4cc9f0; color: #1c1a24; }
  .big-btn:active { transform: scale(0.97); }
  .hidden { display: none; }
  #preview { max-width: 70%; max-height: 32vh; border-radius: 12px; margin: 12px auto; display: block; }
  .fmt-note { font-size: 0.85rem; font-weight: 400; opacity: 0.85; display: block; margin-top: 2px; }
  #result h2 { font-size: 1.5rem; margin-bottom: 8px; }
  #result .pos { font-size: 3rem; font-weight: 800; color: #ffb703; }
  #result p { color: #b9b4c7; margin: 8px 0 20px; }
  #error { color: #ff5d8f; margin-top: 12px; min-height: 1.2em; }
  .spinner { margin: 18px auto; width: 36px; height: 36px; border-radius: 50%;
    border: 4px solid #444; border-top-color: #ffb703; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="step" id="step-pick">
  <h1>📸 Instax Party Printer</h1>
  <p class="sub">Snap or pick a photo — it prints right here at the party!</p>
  <div id="film-status"></div>
  <button class="big-btn" id="pick-btn" onclick="document.getElementById('file').click()">
    Take / Choose Photo
  </button>
  <input type="file" id="file" accept="image/*" capture class="hidden">
</div>

<div class="step hidden" id="step-format">
  <h1>Pick a print size</h1>
  <img id="preview" alt="your photo">
  <button class="big-btn fmt-mini" onclick="upload('mini')">
    Mini <span class="fmt-note">small &amp; tall — classic instax</span>
  </button>
  <button class="big-btn fmt-wide" onclick="upload('wide')">
    Wide <span class="fmt-note">big &amp; wide — group shots</span>
  </button>
  <div id="error"></div>
</div>

<div class="step hidden" id="step-sending">
  <h1>Sending…</h1>
  <div class="spinner"></div>
</div>

<div class="step hidden" id="step-done">
  <div id="result">
    <h2>🎉 In the queue!</h2>
    <div class="pos" id="queue-pos"></div>
    <p id="queue-text"></p>
  </div>
  <button class="big-btn" id="again-btn" style="background:#ffb703;color:#1c1a24"
          onclick="reset()">Print Another</button>
</div>

<script>
  var fileInput = document.getElementById('file');
  var currentFile = null;

  function show(id) {
    ['step-pick','step-format','step-sending','step-done'].forEach(function (s) {
      document.getElementById(s).classList.toggle('hidden', s !== id);
    });
  }

  fileInput.addEventListener('change', function () {
    if (!fileInput.files.length) return;
    currentFile = fileInput.files[0];
    document.getElementById('preview').src = URL.createObjectURL(currentFile);
    document.getElementById('error').textContent = '';
    show('step-format');
  });

  function upload(fmt) {
    if (!currentFile) { reset(); return; }
    show('step-sending');
    var data = new FormData();
    data.append('photo', currentFile, currentFile.name || 'photo.jpg');
    data.append('format', fmt);
    fetch('/upload', { method: 'POST', body: data })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.ok) throw new Error(res.j.error || 'Upload failed');
        document.getElementById('queue-pos').textContent = '#' + res.j.position;
        var text;
        if (res.j.message) {
          text = res.j.message;
        } else if (res.j.position === 1) {
          text = 'Your photo is printing next on the ' + fmt + ' printer!';
        } else {
          text = 'position in the ' + fmt + ' printer queue — hang tight!';
        }
        document.getElementById('queue-text').textContent = text;
        show('step-done');
      })
      .catch(function (e) {
        show('step-format');
        document.getElementById('error').textContent = e.message + ' — try again?';
      });
  }

  function reset() {
    currentFile = null;
    fileInput.value = '';
    show('step-pick');
  }

  function filmLine(s) {
    var label = s.format === 'mini' ? 'Mini' : 'Wide';
    if (s.out_of_film) {
      return '<span class="oof">' + label + ': OUT OF FILM (queue paused, ' +
             s.waiting + ' waiting)</span>';
    }
    if (s.film_left === null) return label + ': ready';
    return label + ': ' + s.film_left + ' print' +
           (s.film_left === 1 ? '' : 's') + ' left';
  }

  function refreshFilmStatus() {
    fetch('/status?json=1')
      .then(function (r) { return r.json(); })
      .then(function (statuses) {
        document.getElementById('film-status').innerHTML =
          statuses.map(filmLine).join(' &nbsp;·&nbsp; ');
      })
      .catch(function () { /* offline blip — keep last known status */ });
  }
  refreshFilmStatus();
  setInterval(refreshFilmStatus, 10000);
</script>
</body>
</html>
